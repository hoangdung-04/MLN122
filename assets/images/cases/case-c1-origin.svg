<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="caseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="20" fill="url(#caseBg)" />

  <!-- Blueprint Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 28)">
    <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="28" y="15" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.3" dominant-baseline="central">HỒ SƠ KHỞI NGUYÊN • CHƯƠNG 1</text>
  </g>

  <!-- Top Right Title -->
  <text x="764" y="42" fill="#38bdf8" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="end" letter-spacing="0.5">ĐẠI ÁN TIẾN TRÌNH TƯ TƯỞNG KINH TẾ</text>
  <text x="764" y="62" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">Cội nguồn "Kinh bang tế thế" &amp; Đỉnh cao KTCT Mác – Lênin</text>

  <!-- Visual Central Display: 3 Timeline Pillars -->
  <!-- Pillar 1: Khởi nguồn 1615 -->
  <g transform="translate(150, 220)">
    <rect x="-85" y="-95" width="170" height="190" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#glow)"/>
    <rect x="-85" y="-95" width="170" height="34" rx="14" fill="rgba(2, 132, 199, 0.2)"/>
    <text x="0" y="-73" fill="#38bdf8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">A. MONTCHRESTIEN</text>
    <text x="0" y="-48" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">NĂM 1615</text>
    <circle cx="0" cy="-5" r="26" fill="rgba(2, 132, 199, 0.15)"/>
    <text x="0" y="3" fill="#38bdf8" font-size="24" text-anchor="middle">📜</text>
    <text x="0" y="42" fill="#cbd5e1" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Chuyên luận về KTCT</text>
    <text x="0" y="60" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Kinh bang tế thế</text>
    <text x="0" y="78" fill="#38bdf8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Thương nhân &amp; Quốc gia</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M239 220 L279 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="279,215 287,220 279,225" fill="#38bdf8"/>

  <!-- Pillar 2: Adam Smith 1776 -->
  <g transform="translate(400, 220)">
    <rect x="-95" y="-105" width="190" height="210" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="-95" y="-105" width="190" height="34" rx="14" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="0" y="-83" fill="#34d399" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ADAM SMITH (1776)</text>
    <text x="0" y="-58" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">HỆ THỐNG KHOA HỌC</text>
    <circle cx="0" cy="-8" r="28" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="0" y="2" fill="#34d399" font-size="26" text-anchor="middle">🏛️</text>
    <text x="0" y="44" fill="#cbd5e1" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">The Wealth of Nations</text>
    <text x="0" y="64" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Mục tiêu kép: Dân giàu</text>
    <text x="0" y="82" fill="#34d399" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">&amp; Ngân sách nhà nước dồi dào</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M499 220 L539 220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="539,215 547,220 539,225" fill="#f59e0b"/>

  <!-- Pillar 3: C. Mác - Ph. Ăng-ghen - V.I. Lênin -->
  <g transform="translate(650, 220)">
    <rect x="-85" y="-95" width="170" height="190" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <rect x="-85" y="-95" width="170" height="34" rx="14" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="0" y="-73" fill="#fbbf24" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">MÁC – ĂNGGHEN – LÊNIN</text>
    <text x="0" y="-48" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">THẾ KỶ XIX – XX</text>
    <circle cx="0" cy="-5" r="26" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="0" y="3" fill="#fbbf24" font-size="24" text-anchor="middle">⭐</text>
    <text x="0" y="42" fill="#cbd5e1" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Đỉnh cao khoa học</text>
    <text x="0" y="60" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Quy luật giá trị thặng dư</text>
    <text x="0" y="78" fill="#fbbf24" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Bản chất quan hệ sản xuất</text>
  </g>

  <!-- Bottom Metadata -->
  <text x="40" y="424" fill="#475569" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700">BỘ MÔN MLN122 • PHILOSOPHY DETECTIVE BUREAU</text>
  <text x="760" y="424" fill="#475569" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">ĐIỀU TRA KINH TẾ CHÍNH TRỊ TRONG ĐỜI SỐNG</text>
</svg>

