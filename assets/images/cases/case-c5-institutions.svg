<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad4)" />

  <!-- Lưới kỹ thuật -->
  <g stroke="#374151" stroke-width="1" opacity="0.35">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header -->
  <g transform="translate(35, 30)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#ec4899" />
    <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif" letter-spacing="1">HỒ SƠ #004 • CHƯƠNG 5</text>
  </g>
  <text x="765" y="48" fill="#ec4899" font-size="12" font-weight="bold" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif">HOÀN THIỆN THỂ CHẾ &amp; HÀI HÒA LỢI ÍCH KINH TẾ</text>

  <!-- Sơ đồ hoàn thiện thể chế -->
  <g transform="translate(50, 85)">
    <!-- Trung tâm: Thể chế KTTT định hướng XHCN -->
    <rect x="220" y="0" width="260" height="60" rx="10" fill="#831843" stroke="#f472b6" stroke-width="2" />
    <text x="350" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">HOÀN THIỆN THỂ CHẾ KTTT</text>
    <text x="350" y="47" fill="#fbcfe8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Định hướng XHCN tại Việt Nam</text>

    <!-- 4 Trụ cột khía cạnh chủ yếu -->
    <g transform="translate(0, 80)">
      <!-- Cột 1 -->
      <rect x="0" y="0" width="165" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="82" y="25" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">THỂ CHẾ SỞ HỮU</text>
      <text x="82" y="45" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">&amp; THÀNH PHẦN KT</text>
      <line x1="15" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1" />
      <text x="82" y="78" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Quyền tài sản</text>
      <text x="82" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Bình đẳng pháp lý</text>
      <text x="82" y="122" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tái cơ cấu DNNN</text>
      <text x="82" y="144" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Hỗ trợ tư nhân</text>
      <text x="82" y="166" fill="#60a5fa" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CHỐNG SÂN SAU</text>
    </g>

    <g transform="translate(178, 80)">
      <rect x="0" y="0" width="165" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="82" y="25" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐỒNG BỘ CÁC LOẠI</text>
      <text x="82" y="45" fill="#6ee7b7" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">THỊ TRƯỜNG</text>
      <line x1="15" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1" />
      <text x="82" y="78" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Đất đai, BĐS</text>
      <text x="82" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tài chính, vốn</text>
      <text x="82" y="122" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lao động &amp; việc làm</text>
      <text x="82" y="144" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Khoa học công nghệ</text>
      <text x="82" y="166" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">MINH BẠCH VỐN</text>
    </g>

    <g transform="translate(356, 80)">
      <rect x="0" y="0" width="165" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="82" y="25" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">HÀI HÒA CÁC QUAN HỆ</text>
      <text x="82" y="45" fill="#fde68a" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">LỢI ÍCH KINH TẾ</text>
      <line x1="15" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1" />
      <text x="82" y="78" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lợi ích cá nhân</text>
      <text x="82" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lợi ích doanh nghiệp</text>
      <text x="82" y="122" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lợi ích người LĐ</text>
      <text x="82" y="144" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lợi ích xã hội</text>
      <text x="82" y="166" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KHÔNG Ô NHIỄM</text>
    </g>

    <g transform="translate(534, 80)">
      <rect x="0" y="0" width="165" height="180" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="82" y="25" fill="#f472b6" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">NÂNG CAO NĂNG LỰC</text>
      <text x="82" y="45" fill="#fbcfe8" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">LÃNH ĐẠO CỦA ĐẢNG</text>
      <line x1="15" y1="55" x2="150" y2="55" stroke="#374151" stroke-width="1" />
      <text x="82" y="78" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Thể chế hóa chủ trương</text>
      <text x="82" y="100" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Quản lý nhà nước</text>
      <text x="82" y="122" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Chống tham nhũng</text>
      <text x="82" y="144" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Giám sát thị trường</text>
      <text x="82" y="166" fill="#f472b6" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">PHÁP QUYỀN XHCN</text>
    </g>
  </g>

  <!-- Chân trang -->
  <rect x="50" y="388" width="700" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="400" y="410" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KẾT LUẬN: Thể chế vững chắc là chìa khóa bảo đảm thị trường vận hành đúng định hướng XHCN!</text>
</svg>

