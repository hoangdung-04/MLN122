<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad6)" />

  <!-- Lưới kỹ thuật -->
  <g stroke="#374151" stroke-width="1" opacity="0.35">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header -->
  <g transform="translate(35, 30)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#818cf8" />
    <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif" letter-spacing="1">HỒ SƠ #006 • CHƯƠNG 6</text>
  </g>
  <text x="765" y="48" fill="#818cf8" font-size="12" font-weight="bold" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif">HỘI NHẬP KINH TẾ QUỐC TẾ &amp; ĐỘC LẬP TỰ CHỦ</text>

  <!-- Sơ đồ Hội nhập quốc tế -->
  <g transform="translate(50, 85)">
    <!-- 2 Mặt của Hội nhập -->
    <g transform="translate(0, 0)">
      <!-- Cột Cơ hội -->
      <g transform="translate(0, 0)">
        <rect width="335" height="150" rx="10" fill="#0f291e" stroke="#10b981" stroke-width="1.5" />
        <text x="167" y="25" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CƠ HỘI &amp; TÁC ĐỘNG TÍCH CỰC</text>
        <line x1="20" y1="36" x2="315" y2="36" stroke="#047857" stroke-width="1" />
        <text x="25" y="58" fill="#ecfdf5" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Mở rộng thị trường xuất khẩu toàn cầu</text>
        <text x="25" y="80" fill="#ecfdf5" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Thu hút vốn FDI, công nghệ &amp; kỹ năng quản lý</text>
        <text x="25" y="102" fill="#ecfdf5" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Thúc đẩy cải cách thể chế kinh tế trong nước</text>
        <text x="25" y="124" fill="#ecfdf5" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Nâng cao vị thế địa chính trị của Việt Nam</text>
      </g>

      <!-- Cột Thách thức -->
      <g transform="translate(365, 0)">
        <rect width="335" height="150" rx="10" fill="#2d1215" stroke="#ef4444" stroke-width="1.5" />
        <text x="167" y="25" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">THÁCH THỨC &amp; RỦI RO</text>
        <line x1="20" y1="36" x2="315" y2="36" stroke="#b91c1c" stroke-width="1" />
        <text x="25" y="58" fill="#fef2f2" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Áp lực cạnh tranh khốc liệt cho doanh nghiệp nội</text>
        <text x="25" y="80" fill="#fef2f2" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Nguy cơ phụ thuộc chuỗi cung ứng bên ngoài</text>
        <text x="25" y="102" fill="#fef2f2" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Gian lận thương mại, "đội lốt" xuất xứ hàng hóa</text>
        <text x="25" y="124" fill="#fef2f2" font-size="10.5" font-family="'Be Vietnam Pro', sans-serif">• Rủi ro trở thành bãi thải công nghệ cũ</text>
      </g>
    </g>

    <!-- Khối Giải pháp cốt lõi: Độc lập tự chủ -->
    <g transform="translate(0, 165)">
      <rect width="700" height="120" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
      <text x="350" y="28" fill="#a5b4fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">PHƯƠNG HƯỚNG CHIẾN LƯỢC: HỘI NHẬP GẮN VỚI TỰ CHỦ KINH TẾ</text>

      <g transform="translate(25, 42)">
        <rect width="200" height="62" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
        <text x="100" y="22" fill="#e0e7ff" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">NÂNG NĂNG LỰC NỘI SINH</text>
        <text x="100" y="44" fill="#c7d2fe" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Làm chủ công nghệ lõi</text>
      </g>

      <g transform="translate(250, 42)">
        <rect width="200" height="62" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
        <text x="100" y="22" fill="#e0e7ff" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐA DẠNG HÓA THỊ TRƯỜNG</text>
        <text x="100" y="44" fill="#c7d2fe" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Tận dụng CPTPP, EVFTA, RCEP</text>
      </g>

      <g transform="translate(475, 42)">
        <rect width="200" height="62" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
        <text x="100" y="22" fill="#e0e7ff" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">PHÒNG VỆ THƯƠNG MẠI</text>
        <text x="100" y="44" fill="#c7d2fe" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Chống gian lận xuất xứ</text>
      </g>
    </g>
  </g>

  <!-- Chân trang -->
  <rect x="50" y="388" width="700" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="400" y="410" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KẾT LUẬN: Hội nhập là tất yếu, nhưng phải giữ vững độc lập, tự chủ kinh tế và an ninh quốc gia!</text>
</svg>

