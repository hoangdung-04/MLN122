<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad3)" />

  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <g transform="translate(35, 30)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif" letter-spacing="1">HỒ SƠ #003 • CHƯƠNG 5</text>
  </g>
  <text x="765" y="48" fill="#10b981" font-size="12" font-weight="bold" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif">5 ĐẶC TRƯNG KTTT ĐỊNH HƯỚNG XHCN Ở VIỆT NAM</text>

  <g transform="translate(50, 85)">
    <g transform="translate(0, 0)">
      <rect width="335" height="85" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif">1. MỤC TIÊU PHÁT TRIỂN KINH TẾ</text>
      <text x="20" y="50" fill="#f8fafc" font-size="11" font-family="'Be Vietnam Pro', sans-serif">Dân giàu, nước mạnh, dân chủ, công bằng, văn minh.</text>
      <text x="20" y="70" fill="#94a3b8" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Giải phóng LLSX, xây dựng CSVC-KT của CNXH.</text>
    </g>

    <g transform="translate(365, 0)">
      <rect width="335" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="20" y="28" fill="#34d399" font-size="12" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif">2. QUAN HỆ SỞ HỮU &amp; THÀNH PHẦN KINH TẾ</text>
      <text x="20" y="50" fill="#f8fafc" font-size="11" font-family="'Be Vietnam Pro', sans-serif">Kinh tế Nhà nước giữ vai trò chủ đạo.</text>
      <text x="20" y="70" fill="#94a3b8" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Kinh tế Tư nhân là động lực quan trọng của nền kinh tế.</text>
    </g>

    <g transform="translate(0, 100)">
      <rect width="335" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="28" fill="#fbbf24" font-size="12" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif">3. QUAN HỆ QUẢN LÝ CỦA NHÀ NƯỚC</text>
      <text x="20" y="50" fill="#f8fafc" font-size="11" font-family="'Be Vietnam Pro', sans-serif">Nhà nước pháp quyền XHCN kiến tạo phát triển.</text>
      <text x="20" y="70" fill="#94a3b8" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Dưới sự lãnh đạo tuyệt đối của Đảng Cộng sản Việt Nam.</text>
    </g>

    <g transform="translate(365, 100)">
      <rect width="335" height="85" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="20" y="28" fill="#c084fc" font-size="12" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif">4. QUAN HỆ PHÂN PHỐI THU NHẬP</text>
      <text x="20" y="50" fill="#f8fafc" font-size="11" font-family="'Be Vietnam Pro', sans-serif">Chủ yếu theo kết quả lao động &amp; hiệu quả kinh tế.</text>
      <text x="20" y="70" fill="#94a3b8" font-size="10" font-family="'Be Vietnam Pro', sans-serif">Kết hợp theo mức đóng góp vốn và qua phúc lợi an sinh.</text>
    </g>

    <g transform="translate(0, 200)">
      <rect width="700" height="85" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
      <text x="350" y="28" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">5. GẮN TĂNG TRƯỞNG KINH TẾ VỚI TIẾN BỘ &amp; CÔNG BẰNG XÃ HỘI</text>
      <text x="350" y="52" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">"Không hy sinh tiến bộ, công bằng xã hội và môi trường để chạy theo tăng trưởng kinh tế đơn thuần."</text>
      <text x="350" y="72" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Tiến bộ và công bằng xã hội được thực hiện ngay trong từng bước đi và từng chính sách phát triển.</text>
    </g>
  </g>

  <rect x="50" y="388" width="700" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="400" y="410" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KẾT LUẬN: KTTT định hướng XHCN là sự kết hợp sáng tạo giữa tính năng động thị trường và mục tiêu nhân văn XHCN!</text>
</svg>
