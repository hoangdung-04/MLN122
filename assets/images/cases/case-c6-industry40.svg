<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2e" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#09131f" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad5)" />

  <!-- Lưới kỹ thuật -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header -->
  <g transform="translate(35, 30)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#06b6d4" />
    <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif" letter-spacing="1">HỒ SƠ #005 • CHƯƠNG 6</text>
  </g>
  <text x="765" y="48" fill="#06b6d4" font-size="12" font-weight="bold" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif">CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA THÍCH ỨNG CMCN 4.0</text>

  <!-- Sơ đồ CNH HĐH 4.0 -->
  <g transform="translate(50, 85)">
    <!-- 4 Cuộc CMCN -->
    <g transform="translate(0, 0)">
      <rect width="700" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <g transform="translate(20, 12)">
        <rect width="145" height="40" rx="6" fill="#0f172a" />
        <text x="72" y="18" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CMCN 1.0 (Thế kỷ 18)</text>
        <text x="72" y="32" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Máy hơi nước &amp; Dệt</text>
      </g>
      <g transform="translate(185, 12)">
        <rect width="145" height="40" rx="6" fill="#0f172a" />
        <text x="72" y="18" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CMCN 2.0 (Cuối TK 19)</text>
        <text x="72" y="32" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Điện năng &amp; Dây chuyền</text>
      </g>
      <g transform="translate(350, 12)">
        <rect width="145" height="40" rx="6" fill="#0f172a" />
        <text x="72" y="18" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CMCN 3.0 (Thập niên 60)</text>
        <text x="72" y="32" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Máy tính &amp; Bán dẫn</text>
      </g>
      <g transform="translate(515, 12)">
        <rect width="165" height="40" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
        <text x="82" y="18" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CMCN 4.0 (Hiện nay)</text>
        <text x="82" y="32" fill="#a5f3fc" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">AI, IoT, Big Data, Cloud</text>
      </g>
    </g>

    <!-- Nội dung CNH HĐH ở Việt Nam -->
    <g transform="translate(0, 85)">
      <!-- Trụ 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="185" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
        <text x="110" y="28" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TÍNH TẤT YẾU KHÁCH QUAN</text>
        <line x1="20" y1="40" x2="200" y2="40" stroke="#334155" stroke-width="1" />
        <text x="110" y="65" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Xây dựng cơ sở vật chất kỹ thuật</text>
        <text x="110" y="90" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Rút ngắn khoảng cách tụt hậu</text>
        <text x="110" y="115" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Nâng cao năng suất lao động</text>
        <text x="110" y="140" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Củng cố quốc phòng an ninh</text>
        <rect x="20" y="152" width="180" height="20" rx="4" fill="#0369a1" />
        <text x="110" y="166" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐỘC LẬP TỰ CHỦ KINH TẾ</text>
      </g>

      <!-- Trụ 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="185" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
        <text x="110" y="28" fill="#22d3ee" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CHUYỂN DỊCH CƠ CẤU</text>
        <line x1="20" y1="40" x2="200" y2="40" stroke="#334155" stroke-width="1" />
        <text x="110" y="65" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Giảm tỷ trọng nông nghiệp</text>
        <text x="110" y="90" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tăng công nghiệp chế biến sâu</text>
        <text x="110" y="115" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Bứt phá ngành dịch vụ số</text>
        <text x="110" y="140" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Kinh tế tri thức &amp; Đổi mới ST</text>
        <rect x="20" y="152" width="180" height="20" rx="4" fill="#0891b2" />
        <text x="110" y="166" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">HIỆN ĐẠI HÓA CÔNG NGHỆ</text>
      </g>

      <!-- Trụ 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="185" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <text x="110" y="28" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CHIẾN LƯỢC ĐI TẮT ĐÓN ĐẦU</text>
        <line x1="20" y1="40" x2="200" y2="40" stroke="#334155" stroke-width="1" />
        <text x="110" y="65" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Phát triển Chính phủ số &amp; Xã hội số</text>
        <text x="110" y="90" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Đào tạo nhân lực công nghệ cao</text>
        <text x="110" y="115" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tận dụng lợi thế nước đi sau</text>
        <text x="110" y="140" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tăng trưởng xanh, kinh tế tuần hoàn</text>
        <rect x="20" y="152" width="180" height="20" rx="4" fill="#059669" />
        <text x="110" y="166" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">PHÁT TRIỂN BỀN VỮNG</text>
      </g>
    </g>
  </g>

  <!-- Chân trang -->
  <rect x="50" y="388" width="700" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="400" y="410" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KẾT LUẬN: CNH, HĐH là con đường tất yếu thoát bẫy thu nhập trung bình trong kỷ nguyên CMCN 4.0!</text>
</svg>

