<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Top Left Badge -->
  <g transform="translate(36, 24)">
    <rect width="320" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="15" cy="14" r="4" fill="#10b981" />
    <text x="28" y="14" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.3" dominant-baseline="central">MLN122 • CHƯƠNG 2 • TIẾN TRÌNH TIỀN TỆ</text>
  </g>

  <!-- Top Right Title & Subtitle -->
  <text x="764" y="34" fill="#10b981" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" letter-spacing="0.5">LỊCH SỬ 4 HÌNH THÁI GIÁ TRỊ &amp; SỰ RA ĐỜI CỦA TIỀN TỆ</text>
  <text x="764" y="52" fill="#94a3b8" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">Giản đơn ➔ Mở rộng ➔ Chung (20 vuông vải) ➔ Tiền tệ (Vàng &amp; Bạc song bản vị)</text>

  <!-- 4 TIMELINE CARDS FOR 4 FORMS OF VALUE (SLIDES 1.3) -->

  <!-- CARD 1: HÌNH THÁI GIẢN ĐƠN / NGẪU NHIÊN -->
  <g transform="translate(36, 68)">
    <rect width="170" height="236" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />
    <rect width="170" height="30" rx="12" fill="rgba(56, 189, 248, 0.15)" />
    <text x="85" y="15" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="central">1. HÌNH THÁI GIẢN ĐƠN</text>
    
    <text x="85" y="44" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">(Ngẫu nhiên trực tiếp)</text>

    <!-- Formula Box -->
    <rect x="12" y="58" width="146" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="85" y="74" fill="#ffffff" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Giá trị A ⇄ GTSD B</text>
    <text x="85" y="90" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">B làm vật ngang giá</text>

    <text x="12" y="118" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• Cuối thời CSNT</text>
    <text x="12" y="134" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• Trao đổi ngẫu nhiên</text>
    <text x="12" y="150" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">• Mầm mống của tiền</text>
    <text x="12" y="166" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">• Hình thái phôi thai</text>

    <rect x="12" y="186" width="146" height="38" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1" />
    <text x="85" y="200" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="800" text-anchor="middle">1 hàng hóa A</text>
    <text x="85" y="214" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">⇄ 1 hàng hóa B</text>
  </g>

  <!-- CARD 2: HÌNH THÁI MỞ RỘNG / ĐẦY ĐỦ -->
  <g transform="translate(222, 68)">
    <rect width="170" height="236" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.6" />
    <rect width="170" height="30" rx="12" fill="rgba(16, 185, 129, 0.15)" />
    <text x="85" y="15" fill="#34d399" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="central">2. HÌNH THÁI MỞ RỘNG</text>
    
    <text x="85" y="44" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">(Đầy đủ quan hệ)</text>

    <!-- Formula Box -->
    <rect x="12" y="58" width="146" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="85" y="74" fill="#ffffff" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">1 Hóa A ⇄ Nhiều Hóa</text>
    <text x="85" y="90" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">LLSX phát triển hơn</text>

    <text x="12" y="118" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• Số lượng hàng hóa</text>
    <text x="12" y="132" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">  đem trao đổi nhiều hơn</text>
    <text x="12" y="148" fill="#10b981" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">• 1 hàng hóa quan hệ</text>
    <text x="12" y="162" fill="#10b981" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">  với nhiều hàng hóa khác</text>

    <rect x="12" y="186" width="146" height="38" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1" />
    <text x="85" y="200" fill="#34d399" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="800" text-anchor="middle">Vải = Áo = Thóc = Cừu</text>
    <text x="85" y="214" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">(Chưa có vật chung)</text>
  </g>

  <!-- CARD 3: HÌNH THÁI CHUNG CỦA GIÁ TRỊ -->
  <g transform="translate(408, 68)">
    <rect width="170" height="236" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6" />
    <rect width="170" height="30" rx="12" fill="rgba(245, 158, 11, 0.15)" />
    <text x="85" y="15" fill="#fbbf24" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="central">3. HÌNH THÁI CHUNG</text>
    
    <text x="85" y="44" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">(Vật ngang giá chung)</text>

    <!-- Formula Box chuẩn Slide: 20 vuông vải -->
    <rect x="12" y="58" width="146" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="85" y="74" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Mọi hàng hóa = } 20 VẢI</text>
    <text x="85" y="90" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">1 vật làm vật ngang giá chung</text>

    <text x="12" y="118" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• 1 cái áo = 20 vuông vải</text>
    <text x="12" y="132" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• 10 đấu chè = 20 vuông vải</text>
    <text x="12" y="146" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• 40 đấu cà phê = 20 v.vải</text>
    <text x="12" y="162" fill="#fbbf24" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="700">• Chưa thống nhất giữa vùng</text>

    <rect x="12" y="186" width="146" height="38" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1" />
    <text x="85" y="200" fill="#fbbf24" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="800" text-anchor="middle">VẬT NGANG GIÁ CHUNG</text>
    <text x="85" y="214" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">Được toàn xã hội quy ước</text>
  </g>

  <!-- CARD 4: HÌNH THÁI TIỀN TỆ (VÀNG / BẠC SONG BẢN VỊ) -->
  <g transform="translate(594, 68)">
    <rect width="170" height="236" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="2" filter="url(#softGlow)" />
    <rect width="170" height="30" rx="12" fill="rgba(234, 179, 8, 0.2)" />
    <text x="85" y="15" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="900" text-anchor="middle" dominant-baseline="central">4. HÌNH THÁI TIỀN TỆ</text>
    
    <text x="85" y="44" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">(Cố định ở Vàng / Bạc)</text>

    <!-- Formula Box chuẩn Slide: 0,2 gam vàng -->
    <rect x="12" y="58" width="146" height="42" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.2" />
    <text x="85" y="74" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Mọi hàng hóa = } 0,2g VÀNG</text>
    <text x="85" y="90" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">Cố định ở Kim loại quý</text>

    <text x="12" y="118" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">• Chế độ song bản vị: Vàng &amp;</text>
    <text x="12" y="132" fill="#e2e8f0" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5">  Bạc cùng làm tiền tệ</text>
    <text x="12" y="148" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">• Ưu thế: Thuần nhất,</text>
    <text x="12" y="162" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="700">  dễ chia nhỏ, không mòn gỉ</text>

    <rect x="12" y="186" width="146" height="38" rx="6" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="1" />
    <text x="85" y="200" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">TIỀN TỆ XUẤT HIỆN</text>
    <text x="85" y="214" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">Vật ngang giá chung độc quyền</text>
  </g>

  <!-- LOWER PANEL: QUY LUẬT GIÁ TRỊ & CƠ CHẾ GIÁ CẢ THỊ TRƯỜNG -->
  <g transform="translate(36, 318)">
    <rect width="728" height="92" rx="12" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Title banner -->
    <rect x="0" y="0" width="728" height="22" rx="12" fill="rgba(56, 189, 248, 0.15)" />
    <text x="364" y="11" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="central">QUY LUẬT GIÁ TRỊ: CƠ CHẾ GIÁ CẢ VẬN ĐỘNG XOAY QUANH TRỤC GIÁ TRỊ</text>

    <!-- Visual Wave & Notes -->
    <g transform="translate(40, 30)">
      <!-- Axis of Value -->
      <line x1="0" y1="26" x2="360" y2="26" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" />
      <text x="365" y="29" fill="#f59e0b" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="800">TRỤC GIÁ TRỊ</text>

      <!-- Sine Wave -->
      <path d="M 0 26 Q 60 -4, 120 26 T 240 26 T 360 26" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="60" cy="11" r="4.5" fill="#38bdf8" />
      <text x="60" y="2" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cung &lt; Cầu (Giá &gt; GT)</text>

      <circle cx="180" cy="41" r="4.5" fill="#f43f5e" />
      <text x="180" y="54" fill="#f43f5e" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Cung &gt; Cầu (Giá &lt; GT)</text>
    </g>

    <!-- Right Summary Box -->
    <g transform="translate(490, 28)">
      <rect width="220" height="54" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="110" y="16" fill="#34d399" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ĐIỀU KIỆN CÂN BẰNG TỔNG THỂ</text>
      <text x="110" y="32" fill="#ffffff" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tổng Giá Cả = Tổng Giá Trị</text>
      <text x="110" y="46" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="8" text-anchor="middle">(Xét trên toàn bộ nền kinh tế xã hội)</text>
    </g>
  </g>

  <!-- Bottom Metadata -->
  <text x="40" y="432" fill="#475569" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="9.5" font-weight="700">KINH TẾ CHÍNH TRỊ TRONG ĐỜI SỐNG</text>
  <text x="760" y="432" fill="#475569" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="end">MLN122 • KHOA HỌC KINH TẾ CHÍNH TRỊ MÁC – LÊNIN</text>
</svg>