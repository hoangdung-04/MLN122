<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Nền Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad1)" />

  <!-- Lưới kỹ thuật thị trường -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header Card Badge -->
  <g transform="translate(35, 30)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="32" y="20" fill="#f8fafc" font-size="11" font-weight="bold" font-family="'Be Vietnam Pro', sans-serif" letter-spacing="1">HỒ SƠ #001 • CHƯƠNG 3</text>
  </g>
  <text x="765" y="48" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif">BÓC TÁCH CẤU TRÚC GIÁ TRỊ: W = c + v + m</text>

  <!-- Sơ đồ bóc tách cấu trúc giá trị hàng hóa -->
  <g transform="translate(60, 95)">
    <!-- Hàng hóa W -->
    <rect x="0" y="0" width="680" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="340" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TỔNG GIÁ TRỊ HÀNG HÓA NỀN TẢNG SỐ (W = c + v + m)</text>
    <text x="340" y="55" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">Doanh thu cuốc xe / Phí dịch vụ nền tảng số thu từ thị trường</text>

    <!-- Khối c: Tư bản bất biến -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="210" height="180" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="15" y="15" width="180" height="26" rx="13" fill="rgba(14, 165, 233, 0.18)" />
      <text x="105" y="32" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TƯ BẢN BẤT BIẾN (c)</text>
      <text x="105" y="72" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">c = c1 + c2</text>
      <text x="105" y="100" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Máy chủ, máy tính</text>
      <text x="105" y="122" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Phần mềm, bản quyền</text>
      <text x="105" y="144" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Văn phòng &amp; hạ tầng</text>
      <rect x="15" y="156" width="180" height="18" rx="4" fill="#0369a1" />
      <text x="105" y="169" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CHỈ CHUYỂN DỊCH GIÁ TRỊ</text>
    </g>

    <!-- Dấu + -->
    <text x="225" y="195" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle">+</text>

    <!-- Khối v: Tư bản khả biến -->
    <g transform="translate(240, 95)">
      <rect x="0" y="0" width="200" height="180" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect x="15" y="15" width="170" height="26" rx="13" fill="rgba(16, 185, 129, 0.18)" />
      <text x="100" y="32" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TƯ BẢN KHẢ BIẾN (v)</text>
      <text x="100" y="72" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">SỨC LAO ĐỘNG SỐNG</text>
      <text x="100" y="100" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tiền công kỹ sư, coder</text>
      <text x="100" y="122" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Thu nhập tài xế công nghệ</text>
      <text x="100" y="144" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tái sản xuất sức LĐ</text>
      <rect x="15" y="156" width="170" height="18" rx="4" fill="#059669" />
      <text x="100" y="169" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">NGUỒN GỐC SINH GIÁ TRỊ MỚI</text>
    </g>

    <!-- Dấu + -->
    <text x="455" y="195" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle">+</text>

    <!-- Khối m: Giá trị thặng dư -->
    <g transform="translate(470, 95)">
      <rect x="0" y="0" width="210" height="180" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
      <rect x="15" y="15" width="180" height="26" rx="13" fill="rgba(245, 158, 11, 0.22)" />
      <text x="105" y="32" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">GIÁ TRỊ THẶNG DƯ (m)</text>
      <text x="105" y="72" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">m DO LAO ĐỘNG TẠO RA</text>
      <text x="105" y="100" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Thời gian LĐ thặng dư</text>
      <text x="105" y="122" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Tỷ lệ chiết khấu 30%</text>
      <text x="105" y="144" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">• Lợi nhuận siêu ngạch</text>
      <rect x="15" y="156" width="180" height="18" rx="4" fill="#d97706" />
      <text x="105" y="169" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CHỦ NỀN TẢNG CHIẾM ĐOẠT</text>
    </g>
  </g>

  <!-- Chân trang kết luận -->
  <rect x="60" y="388" width="680" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="400" y="410" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">KẾT LUẬN ĐIỀU TRA: Thuật toán AI không tạo ra m; chỉ sức lao động sống (v) mới sáng tạo ra m!</text>
</svg>

