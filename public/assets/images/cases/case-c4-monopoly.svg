<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="caseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#150f28" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="20" fill="url(#caseBg)" />

  <!-- Blueprint Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(36, 28)">
    <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4.5" fill="#a855f7" />
    <text x="28" y="15" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.3" dominant-baseline="central">HỒ SƠ ĐỘC QUYỀN • CHƯƠNG 4</text>
  </g>

  <!-- Top Right Title -->
  <text x="764" y="42" fill="#c084fc" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="end" letter-spacing="0.5">ĐẠI ÁN ĐỘC QUYỀN &amp; TƯ BẢN TÀI CHÍNH</text>
  <text x="764" y="62" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">5 đặc điểm kinh tế của độc quyền • Vai trò &amp; giới hạn lịch sử của CNTB</text>

  <!-- 3 Main Pillars -->
  <!-- Pillar 1: Các tổ chức độc quyền (Cartel - Syndicate - Trust - Consortium) -->
  <g transform="translate(150, 220)">
    <rect x="-85" y="-95" width="170" height="190" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <rect x="-85" y="-95" width="170" height="34" rx="14" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="0" y="-73" fill="#c084fc" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">TỔ CHỨC ĐỘC QUYỀN</text>
    <text x="0" y="-48" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">TÍCH TỤ &amp; TẬP TRUNG</text>
    <line x1="-70" y1="-38" x2="70" y2="-38" stroke="#334155" stroke-width="1"/>

    <text x="-70" y="-18" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• 1. Cartel (giá/thị phần)</text>
    <text x="-70" y="2" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• 2. Syndicate (lưu thông)</text>
    <text x="-70" y="22" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• 3. Trust (SX &amp; lưu thông)</text>
    <text x="-70" y="42" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• 4. Consortium (đa ngành)</text>

    <rect x="-75" y="58" width="150" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="0" y="74" fill="#c084fc" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="800" text-anchor="middle">KHỐNG CHẾ THỊ TRƯỜNG</text>
  </g>

  <!-- Pillar 2: Tư bản tài chính & Xuất khẩu tư bản -->
  <g transform="translate(400, 220)">
    <rect x="-105" y="-95" width="210" height="190" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect x="-105" y="-95" width="210" height="34" rx="14" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="0" y="-73" fill="#38bdf8" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">TƯ BẢN TÀI CHÍNH</text>
    <text x="0" y="-48" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">XUẤT KHẨU TƯ BẢN</text>
    <line x1="-90" y1="-38" x2="90" y2="-38" stroke="#334155" stroke-width="1"/>

    <text x="0" y="-18" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" text-anchor="middle">Ngân hàng ⇄ Công nghiệp</text>
    <text x="0" y="2" fill="#facc15" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ĐẦU SỎ TÀI CHÍNH</text>
    <text x="0" y="22" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">Thống trị qua "Chế độ tham dự"</text>
    <text x="0" y="40" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="9" text-anchor="middle">Xuất khẩu giá trị thu GTTD cao</text>

    <rect x="-95" y="58" width="190" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="74" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="800" text-anchor="middle">CHI PHỐI KINH TẾ &amp; CHÍNH TRỊ</text>
  </g>

  <!-- Pillar 3: Phân chia thế giới & Giới hạn lịch sử -->
  <g transform="translate(650, 220)">
    <rect x="-85" y="-95" width="170" height="190" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <rect x="-85" y="-95" width="170" height="34" rx="14" fill="rgba(244, 63, 94, 0.2)"/>
    <text x="0" y="-73" fill="#fb7185" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">PHÂN CHIA THẾ GIỚI</text>
    <text x="0" y="-48" fill="#e2e8f0" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">GIỚI HẠN LỊCH SỬ</text>
    <line x1="-70" y1="-38" x2="70" y2="-38" stroke="#334155" stroke-width="1"/>

    <text x="-70" y="-18" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• Phân chia thị trường (TNCs)</text>
    <text x="-70" y="2" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• Phân chia lãnh thổ thế giới</text>
    <text x="-70" y="22" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• Mâu thuẫn LLSX hóa cao</text>
    <text x="-70" y="42" fill="#cbd5e1" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5">• với Chiếm hữu tư nhân</text>

    <rect x="-75" y="58" width="150" height="24" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="0" y="74" fill="#fb7185" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="800" text-anchor="middle">TẤT YẾU BỊ THAY THẾ</text>
  </g>

  <!-- Connecting dashed arrows -->
  <path d="M 235 220 L 295 220" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M 505 220 L 565 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Footer -->
  <text x="40" y="426" fill="#475569" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700">VĂN PHÒNG THÁM TỬ KINH TẾ • BẰNG CHỨNG LÝ LUẬN CỦA V.I. LÊNIN VỀ ĐỘC QUYỀN</text>
  <text x="764" y="426" fill="#475569" font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" text-anchor="end">MLN122 • VĂN PHÒNG THÁM TỬ LÝ LUẬN</text>
</svg>
