name: Kiểm tra & Tự động Triển khai

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Thiết lập Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Cài đặt thư viện (Install)
        run: npm ci || npm install

      - name: 🚀 Xây dựng dự án (Build)
        run: npm run build

      - name: 🌐 Xuất bản lên nhánh gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

